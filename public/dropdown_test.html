<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sensor Data Explorer (Work in Progress)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body onload="onBuildingChange()">
    <h1>Dropdown test</h1>

    <p>
        <label for="building">Building</label><br>
        <select id="building" onchange="onBuildingChange()"><option value="Cooley">Cooley</option></select>
    </p>

    <p>
        <label for="room">Room</label><br>
        <select id="room" disabled onchange="onRoomChange()"></select>
    </p>

    <p>
        <label for="sensor">Sensor</label><br>
        <select id="sensor" disabled onchange="onSensorChange()"></select>
    </p>

    <p>
        <label for="metric">Data type</label><br>
        <select id="metric" disabled onchange="onSubmit()"></select>
    </p>

    <button id="submit-query-btn" onclick="onSubmit()">Get Data</button>

    <div style="height: 400px; margin-top: 2rem;">
        <canvas id="explorer-chart"></canvas>
    </div>

    <script src="js/api-fetch.js"></script>
</body>
</html>
